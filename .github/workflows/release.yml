name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write # Required to push images to GHCR

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Set up QEMU
        # Required for cross-compiling container architectures (amd64/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write AUR SSH key
        env:
          AUR_SSH_KEY_CONTENT: ${{ secrets.AUR_SSH_KEY }}
        if: env.AUR_SSH_KEY_CONTENT != ''
        run: |
          mkdir -p "$HOME/.secrets"
          # Trailing newline: ssh is lenient, but a key pasted without one is a
          # common way to end up with "error in libcrypto" instead of a clean error.
          printf '%s\n' "$AUR_SSH_KEY_CONTENT" > "$HOME/.secrets/aur_key"
          chmod 600 "$HOME/.secrets/aur_key"
          # Fail here with an actionable message rather than halfway through the
          # GoReleaser run, after the GitHub release has been published.
          if ! ssh-keygen -y -f "$HOME/.secrets/aur_key" < /dev/null > /dev/null 2>&1; then
            echo "::error::AUR_SSH_KEY is not a usable private key (expected an unencrypted OpenSSH or PEM key, with header and footer)"
            exit 1
          fi
          echo "AUR_SSH_KEY=$HOME/.secrets/aur_key" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN:   ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.SCOOP_GITHUB_TOKEN }}
          AUR_SSH_KEY:        ${{ env.AUR_SSH_KEY }}