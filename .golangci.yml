version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - godot
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    godot:
      scope: declarations
    gosec:
      excludes:
        - G304
        - G306
    revive:
      rules:
        - name: exported
          disabled: false
        - name: unused-parameter
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bethropolis/localgo
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
